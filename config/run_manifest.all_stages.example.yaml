    encoding: ascii
    require_actual_output: true
    require_expected_output: true
    require_fixed_width: true
    allowed_classifications:
    - S
    - L
    - N
    identity_fields:
    - hicn
    - provider_id
    - admission_date
    - split_year_indicator
    sort_fields:
    - hicn
    - provider_id
    - split_year_indicator
