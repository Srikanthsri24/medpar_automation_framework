    rule6_enabled: true
    rule6_drop_codes:
    - 4
    - 6
    sort_fields:
    - hicn
    - provider_id
    - stay_from_date
    - stay_thru_date
    - processing_date
    - accrete_date
    - source_sequence
  split:
