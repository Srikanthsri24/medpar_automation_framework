run_id: all_5_stages_user_run
run_date: 2026-07-19

# Replace the globs below with your real files. Remove a stage section when you do not
# have files for that stage. source=stage input, actual_output=application result,
# expected_output=approved golden result.
files:
  - path: data/user_inputs/final_action/source/*.json
    stage: final_action
    role: source

  - path: data/user_inputs/split/source/*.json
    stage: split
    role: source

  - path: data/user_inputs/stay/source/*
    stage: stay
    role: source
  - path: data/user_inputs/stay/actual_output/*
    stage: stay
    role: actual_output
  - path: data/user_inputs/stay/expected_output/*
    stage: stay
    role: expected_output

  - path: data/user_inputs/intermediate/source/*
    stage: intermediate
    role: source
  - path: data/user_inputs/intermediate/actual_output/*
    stage: intermediate
    role: actual_output
  - path: data/user_inputs/intermediate/expected_output/*
    stage: intermediate
    role: expected_output

  - path: data/user_inputs/final_medpar/source/*
    stage: final_medpar
    role: source
  - path: data/user_inputs/final_medpar/actual_output/*
    stage: final_medpar
    role: actual_output
  - path: data/user_inputs/final_medpar/expected_output/*
    stage: final_medpar
    role: expected_output

settings:
  final_action:
    rule1_keep_qcs: [1, 3, 5]
    allowed_query_codes: [0, 1, 3, 5]
    allowed_transaction_codes: [0, 1, 2, 3, 4]
    block_ambiguous_ordering: true
    rule6_enabled: true

  split:
    window_years: 4
    skip_transaction_codes: []
    require_actual_output: false

  stay:
    decimal_scale: "0.001"
    require_actual_output: true
    require_expected_output: true

  intermediate:
    window_years: 5
    decimal_scale: "0.001"
    ndc_length: 11
    require_actual_output: true
    require_expected_output: true

  final_medpar:
    expected_bytes: 3000
    encoding: ascii
    require_fixed_width: true
    require_actual_output: true
    require_expected_output: true
    allowed_classifications: [S, L, N]
    # Add approved one-based byte offsets only after the official 3000-byte layout is supplied.
    field_layout: []
