run_id: local-example
run_date: "2026-07-19"
settings:
  decimal_scale: "0.001"
  rounding_mode: ROUND_HALF_UP
  final_medpar_bytes: 3000
  split_window_years: 4
  intermediate_window_years: 5
  final_action:
    rule1_keep_qcs: [1, 3, 5]
    allowed_query_codes: [0, 1, 3, 5]
    allowed_transaction_codes: [0, 1, 2, 3, 4]
    require_accrete_date: false
    block_ambiguous_ordering: true
    rule6_enabled: true
    identity_fields:
      - claim_can
      - icn
      - query_code
      - processing_date
      - accrete_date

files:
  - path: sample_data/input/final_action/sample_claims.json
    stage: final_action
    role: source
    format: json

