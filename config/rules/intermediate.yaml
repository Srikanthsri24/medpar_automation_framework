business_validations:
  - each accommodation charge is rounded to three decimals before MEDPAR-TOT-ACC-CHRG-0430 summation
  - passThruPerDiem is rounded before multiplication by utilizationDays for MEDPAR-BILL-TOT-PERDIEM-0381
  - revenue codes 0200 and 0201 are included in the intensive-care indicator search family
  - MEDPAR-ORGAN-IND-0487 is derived from the configured legacy organ-acquisition revenue-code list
  - medparAdmDay0090 is derived from admissionDate using Sunday=1 through Saturday=7
  - all amount fields use Decimal and explicit three-decimal precision
  - negative amount signs are preserved and rounded using configured mode
  - repeated accommodation arrays retain order and duplicates
  - total accommodation charge equals the sum of individually rounded eligible charges
  - procedure code/date/version groups align, include all claims, and do not exceed 25
  - procedure dates are inside the January-aligned five-year window
  - diagnosis, version and POA arrays align and counts match
  - condition switches are derived from configured condition codes
  - revenue-center line subfields are validated field by field
  - direct-move fields remain unchanged from Stay to Intermediate
  - selected Intermediate fields are verified again in Final MEDPAR golden comparison
configuration_notes:
  organ_revenue_codes: configurable; default 0810 through 0819 pending legacy-owner confirmation
  emergency_use_switch: source condition-code mapping was not supplied and remains an open requirement
