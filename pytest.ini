[pytest]
testpaths = tests
pythonpath = src
addopts = -ra --strict-markers -p medpar_qa.reporting.pytest_plugin
markers =
    unit: fast isolated validation tests
    integration: multi-component tests
    regression: approved business regression tests
    byte_by_byte: fixed-width or field-level byte comparison
    final_action: Final Action stage
    split: Four-Year Split stage
    stay: Stay stage
    intermediate: Intermediate stage
    final_medpar: Final MEDPAR stage
    decimal_precision: Decimal precision and rounding tests
    condition_codes: condition-code validations
    occurrence_codes: occurrence-code validations
    procedure_codes: procedure-code/date validations
    diagnosis_codes: diagnosis and POA validations
    input_data: tests that execute supplied JSON or Parquet business files
